<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" width="100%"><defs><marker id="fl" markerWidth="8" markerHeight="8" refX="7" refY="2.8" orient="auto"><path d="M0,0 L6.5,2.8 L0,5.6 z" fill="#8a7f72"/></marker><marker id="flv" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto"><path d="M0,0 L7.5,3.2 L0,6.4 z" fill="#2f5d8a"/></marker><marker id="creux" markerWidth="11" markerHeight="11" refX="10" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#fdfbf8" stroke="#8a7f72" stroke-width="1"/></marker></defs><rect width="1180" height="640" fill="#fdfbf8"/>
<text x="590" y="34" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#1a1714" text-anchor="middle">CYCLE DE VIE D'UN JALON</text>
<text x="590" y="54" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="11" font-style="italic" fill="#7a6a58" text-anchor="middle">Deux axes indépendants : l'avancement des travaux et l'état des fonds.</text>
<rect x="70" y="120" width="160" height="62" rx="10" fill="#fff" stroke="#a89b8a" stroke-width="1.3"/>
<text x="150" y="144" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#a89b8a" text-anchor="middle">a_venir</text>
<text x="150" y="164" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="10" fill="#7a6a58" text-anchor="middle">non_appele</text>
<rect x="300" y="120" width="160" height="62" rx="10" fill="#fff" stroke="#2f5d8a" stroke-width="1.3"/>
<text x="380" y="144" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#2f5d8a" text-anchor="middle">en_cours</text>
<text x="380" y="164" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="10" fill="#7a6a58" text-anchor="middle">attente_encaissement</text>
<rect x="540" y="120" width="160" height="62" rx="10" fill="#fff" stroke="#8a5a1c" stroke-width="1.3"/>
<text x="620" y="144" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#8a5a1c" text-anchor="middle">en_cours</text>
<text x="620" y="164" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="10" fill="#7a6a58" text-anchor="middle">sequestre</text>
<rect x="780" y="120" width="160" height="62" rx="10" fill="#fff" stroke="#8a5a1c" stroke-width="1.3"/>
<text x="860" y="144" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#8a5a1c" text-anchor="middle">a_valider</text>
<text x="860" y="164" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="10" fill="#7a6a58" text-anchor="middle">sequestre</text>
<rect x="1000" y="120" width="160" height="62" rx="10" fill="#fff" stroke="#1f6b4a" stroke-width="1.3"/>
<text x="1080" y="144" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#1f6b4a" text-anchor="middle">valide</text>
<text x="1080" y="164" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="10" fill="#7a6a58" text-anchor="middle">reverse</text>
