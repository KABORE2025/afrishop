<text x="500.0" y="143" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.5" fill="#5a5048" text-anchor="middle">encaisser()</text>
<polyline points="700,151 780,151" fill="none" stroke="#8a7f72" stroke-width="1.2" marker-end="url(#fl)"/>
<text x="740.0" y="143" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.5" fill="#5a5048" text-anchor="middle">travaux finis</text>
<polyline points="940,151 1000,151" fill="none" stroke="#8a7f72" stroke-width="1.2" marker-end="url(#fl)"/>
<text x="970.0" y="143" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.5" fill="#5a5048" text-anchor="middle">valider()</text>
<polyline points="860,182 780,330" fill="none" stroke="#8a7f72" stroke-width="1.2" marker-end="url(#fl)"/>
<text x="820.0" y="174" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.5" fill="#5a5048" text-anchor="middle">contester()</text>
<path d="M70,250 h526 l14,14 v128 h-540 z" fill="#fdf6e8" stroke="#b58a3a" stroke-width="1"/>
<path d="M596,250 v14 h14 z" fill="#f3e4c4" stroke="#b58a3a" stroke-width="1"/>
<text x="78" y="268" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">POURQUOI LE DÉCOUPAGE EN JALONS EXISTE</text>
<text x="78" y="281" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start"></text>
<text x="78" y="294" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">Le séquestre marchand tient parce qu'il est court et petit : 35 000 F</text>
<text x="78" y="307" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">pendant trois jours. Appliqué tel quel à un chantier, il deviendrait</text>
<text x="78" y="320" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">25 millions pendant huit mois — ce n'est plus la même activité, c'est</text>
<text x="78" y="333" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">un métier réglementé.</text>
<text x="78" y="346" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start"></text>
<text x="78" y="359" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">On ne séquestre donc JAMAIS le contrat entier, seulement la tranche en</text>
<text x="78" y="372" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">cours. Sur 25 millions découpés en quatre, l'exposition plafonne à</text>
<text x="78" y="385" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">7,5 millions et n'y reste que le temps d'une étape.</text>
<path d="M660,430 h466 l14,14 v76 h-480 z" fill="#fdf6e8" stroke="#b58a3a" stroke-width="1"/>
<path d="M1126,430 v14 h14 z" fill="#f3e4c4" stroke="#b58a3a" stroke-width="1"/>
<text x="668" y="448" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">LA CONTESTATION NE REMBOURSE PAS AUTOMATIQUEMENT</text>
<text x="668" y="461" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start"></text>
<text x="668" y="474" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">Sur un chantier, la vérité est rarement d'un seul côté : une dalle mal</text>
<text x="668" y="487" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">finie n'annule pas les fondations. L'arbitrage peut trancher pour un</text>
<text x="668" y="500" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">versement partiel — ce qu'un remboursement automatique aurait rendu</text>
<text x="668" y="513" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">impossible.</text></svg>