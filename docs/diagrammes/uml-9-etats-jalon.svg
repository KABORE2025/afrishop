<text x="740" y="354" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#b3261e" text-anchor="middle">conteste</text>
<text x="740" y="374" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="10" fill="#7a6a58" text-anchor="middle">sequestre (gelé)</text>
