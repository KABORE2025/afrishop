<text x="668" y="618" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">Le livreur détient physiquement l'argent des vendeurs.</text>
<text x="668" y="631" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">Sans suivi ligne à ligne des remises, la démarque est invisible.</text></svg>