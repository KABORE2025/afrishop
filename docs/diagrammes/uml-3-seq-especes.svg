<text x="68" y="618" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">LE RISQUE PROPRE À CE MODE : le client peut refuser le colis à sa porte.</text>
<text x="68" y="631" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">Le vendeur a préparé, le livreur s'est déplacé, et personne n'est payé.</text>
<text x="68" y="644" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">D'où le suivi du taux de refus par client, et le passage au prépaiement</text>
