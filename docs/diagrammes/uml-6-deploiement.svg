<text x="570" y="30" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1a1714" text-anchor="middle">UML — DIAGRAMME DE DÉPLOIEMENT</text>
<text x="570" y="50" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="11" font-style="italic" fill="#7a6a58" text-anchor="middle">Une architecture volontairement modeste : un seul serveur au démarrage, découpable ensuite.</text>
