<text x="382" y="234" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.8" fill="#4a423a" text-anchor="start">Un seul serveur suffit au démarrage.</text>
<text x="382" y="249" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.8" fill="#4a423a" text-anchor="start">Découper trop tôt coûte plus qu'il ne rapporte.</text>
