<text x="912" y="160" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.5" font-weight="700" fill="#6b3fa0" text-anchor="start">2.</text>
<text x="928" y="160" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.6" fill="#4a423a" text-anchor="start">Un proche règle sur place</text>
<text x="912" y="180" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.5" font-weight="700" fill="#6b3fa0" text-anchor="start">3.</text>
<text x="928" y="180" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.6" fill="#4a423a" text-anchor="start">On prépare et on remet</text>
<text x="912" y="200" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.5" font-weight="700" fill="#6b3fa0" text-anchor="start">4.</text>
<text x="928" y="200" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.6" fill="#4a423a" text-anchor="start">Preuve signée → fin de notre rôle</text>
<line x1="912" y1="226" x2="1138" y2="226" stroke="#e5ddd0" stroke-width="1"/>
<text x="912" y="244" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="8.2" font-weight="700" fill="#8a7f72" text-anchor="start">ARGENT</text>
