<text x="638" y="180" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.6" fill="#4a423a" text-anchor="start">Il repart avec son achat</text>
<text x="622" y="200" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.5" font-weight="700" fill="#0f7b8a" text-anchor="start">4.</text>
