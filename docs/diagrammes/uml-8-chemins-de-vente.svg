<text x="165.0" y="108" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">1 · VENTE EN LIGNE, LIVRAISON LOCALE</text>
<text x="42" y="140" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.5" font-weight="700" fill="#2f5d8a" text-anchor="start">1.</text>
<text x="58" y="140" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.6" fill="#4a423a" text-anchor="start">Le client commande et paie</text>
<text x="42" y="160" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.5" font-weight="700" fill="#2f5d8a" text-anchor="start">2.</text>
<text x="58" y="160" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.6" fill="#4a423a" text-anchor="start">Le vendeur prépare</text>
<text x="42" y="180" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.5" font-weight="700" fill="#2f5d8a" text-anchor="start">3.</text>
<text x="58" y="180" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.6" fill="#4a423a" text-anchor="start">Le livreur remet contre code</text>
<text x="42" y="200" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.5" font-weight="700" fill="#2f5d8a" text-anchor="start">4.</text>
<text x="58" y="200" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.6" fill="#4a423a" text-anchor="start">Les fonds se libèrent après 3 j</text>
