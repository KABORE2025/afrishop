<text x="745.0" y="108" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">3 · VENTE AU COMPTOIR</text>
<text x="622" y="140" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.5" font-weight="700" fill="#0f7b8a" text-anchor="start">1.</text>
