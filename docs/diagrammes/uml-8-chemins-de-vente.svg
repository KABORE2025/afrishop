<text x="590" y="30" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1a1714" text-anchor="middle">LES QUATRE CHEMINS DE VENTE</text>
<text x="590" y="50" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="11" font-style="italic" fill="#7a6a58" text-anchor="middle">Ce qui les distingue n'est pas le produit, mais le trajet de l'argent et celui du colis.</text>
