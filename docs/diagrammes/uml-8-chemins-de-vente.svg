<text x="420" y="476" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#4a423a" text-anchor="start">oui</text>
<text x="610" y="476" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#4a423a" text-anchor="start">oui</text>
