<path d="M328,90 h254 a8,8 0 0 1 8,8 v22 h-270 v-22 a8,8 0 0 1 8,-8 z" fill="#8a5a1c"/>
<text x="455.0" y="108" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">2 · PAIEMENT À LA LIVRAISON</text>
<text x="332" y="140" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.5" font-weight="700" fill="#8a5a1c" text-anchor="start">1.</text>
<text x="348" y="140" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.6" fill="#4a423a" text-anchor="start">Le client commande</text>
<text x="332" y="160" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.5" font-weight="700" fill="#8a5a1c" text-anchor="start">2.</text>
<text x="348" y="160" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.6" fill="#4a423a" text-anchor="start">Aucun encaissement</text>
<text x="332" y="180" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.5" font-weight="700" fill="#8a5a1c" text-anchor="start">3.</text>
