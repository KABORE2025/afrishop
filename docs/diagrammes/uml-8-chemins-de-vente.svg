<text x="38" y="578" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">LA VENTE AU COMPTOIR N'EST PAS UN DÉTAIL. Sans elle, le vendeur écoule au marché</text>
<text x="38" y="591" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">ce que le site affiche disponible, et un client commande un produit qui n'existe plus.</text>
<text x="38" y="604" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">C'est la première cause de litige évitable — et la raison pour laquelle la commission</text>
<text x="38" y="617" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">y est nulle par défaut : sinon personne ne déclarerait ces ventes.</text>
<path d="M605,560 h531 l14,14 v63 h-545 z" fill="#fdf6e8" stroke="#b58a3a" stroke-width="1"/>
<path d="M1136,560 v14 h14 z" fill="#f3e4c4" stroke="#b58a3a" stroke-width="1"/>
<text x="613" y="578" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">L'EXPORT PAR TRANSITAIRE ÉVITE LE PLUS COÛTEUX DE L'INTERNATIONAL : codes tarifaires</text>
<text x="613" y="591" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">par produit, calcul des droits par pays, seuils de franchise, débat DDP/DAP, et surtout</text>
<text x="613" y="604" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">les colis refusés en douane — un aller-retour intercontinental payé pour rien.</text>
<text x="613" y="617" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">En contrepartie, une mention à faire accepter noir sur blanc : les droits à l'arrivée</text>
<text x="613" y="630" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">sont à la charge du destinataire.</text></svg>