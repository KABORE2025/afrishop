<text x="42" y="278" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="8.2" font-weight="700" fill="#8a7f72" text-anchor="start">COLIS</text>
<text x="42" y="292" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#1a1714" text-anchor="start">Afrishop livre</text>
