<polyline points="730,390 780,390" fill="none" stroke="#8a7f72" stroke-width="1.2" marker-end="url(#fl)"/>
<text x="750" y="595" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="10.5" font-weight="700" fill="#1f6b4a" text-anchor="start">oui → afficher</text>
<polyline points="730,590 780,590" fill="none" stroke="#8a7f72" stroke-width="1.2" marker-end="url(#fl)"/>
<text x="568" y="435" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="10" fill="#b3261e" text-anchor="start">non</text>
<text x="568" y="635" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="10" fill="#b3261e" text-anchor="start">non</text>
<path d="M40,165 h306 l14,14 v193 h-320 z" fill="#fdf6e8" stroke="#b58a3a" stroke-width="1"/>
<path d="M346,165 v14 h14 z" fill="#f3e4c4" stroke="#b58a3a" stroke-width="1"/>
<text x="48" y="183" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">LE PIÈGE DE LA COUCHE 3</text>
<text x="48" y="196" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start"></text>
<text x="48" y="209" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">Appliquer la tolérance aux fautes EN MÊME</text>
<text x="48" y="222" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">TEMPS que la correspondance exacte est une</text>
<text x="48" y="235" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">erreur classique.</text>
<text x="48" y="248" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start"></text>
<text x="48" y="261" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">Sur « maison », l'exact remonte les</text>
<text x="48" y="274" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">constructions ; le flou y ajoute « Miel de</text>
<text x="48" y="287" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">karité », dont la description contient</text>
<text x="48" y="300" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">« saison », à une lettre près.</text>
<text x="48" y="313" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start"></text>
<text x="48" y="326" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">Le client voit du miel dans une recherche de</text>
<text x="48" y="339" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">maçonnerie et cesse de croire aux résultats.</text>
<text x="48" y="352" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start"></text>
<text x="48" y="365" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">Le flou est un FILET, pas une voie parallèle.</text>
<path d="M40,500 h306 l14,14 v167 h-320 z" fill="#fdf6e8" stroke="#b58a3a" stroke-width="1"/>
<path d="M346,500 v14 h14 z" fill="#f3e4c4" stroke="#b58a3a" stroke-width="1"/>
<text x="48" y="518" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">LA COUCHE 4 EST LA PLUS RENTABLE</text>
<text x="48" y="531" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start"></text>
<text x="48" y="544" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">Une recherche vide ne produit ni erreur, ni</text>
<text x="48" y="557" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">réclamation, ni ticket. Le client s'en va en</text>
<text x="48" y="570" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">pensant que la plateforme est vide.</text>
<text x="48" y="583" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start"></text>
<text x="48" y="596" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">C'est la panne la plus coûteuse d'un catalogue</text>
<text x="48" y="609" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">parce qu'elle est SILENCIEUSE : elle ne se voit</text>
<text x="48" y="622" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">que dans une courbe de ventes qui ne décolle</text>
<text x="48" y="635" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">pas.</text>
<text x="48" y="648" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start"></text>
<text x="48" y="661" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">Le journal la rend visible — et chaque ligne</text>
<text x="48" y="674" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="9.4" fill="#6b5424" text-anchor="start">traitée rouvre une vente pour tous les suivants.</text></svg>