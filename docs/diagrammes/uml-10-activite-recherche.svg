<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 800" width="100%"><defs><marker id="fl" markerWidth="8" markerHeight="8" refX="7" refY="2.8" orient="auto"><path d="M0,0 L6.5,2.8 L0,5.6 z" fill="#8a7f72"/></marker><marker id="flv" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto"><path d="M0,0 L7.5,3.2 L0,6.4 z" fill="#2f5d8a"/></marker><marker id="creux" markerWidth="11" markerHeight="11" refX="10" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#fdfbf8" stroke="#8a7f72" stroke-width="1"/></marker></defs><rect width="1120" height="800" fill="#fdfbf8"/>
<text x="560" y="34" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#1a1714" text-anchor="middle">RECHERCHE — QUATRE COUCHES, DU MOINS CHER AU PLUS CHER</text>
<text x="560" y="54" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="11" font-style="italic" fill="#7a6a58" text-anchor="middle">On ne descend à la couche suivante que si la précédente n'a rien donné.</text>
<rect x="390" y="90" width="340" height="34" rx="8" fill="#fff" stroke="#3d3630" stroke-width="1.3"/>
<text x="560" y="111" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#3d3630" text-anchor="middle">Requête du client</text>
<rect x="390" y="165" width="340" height="48" rx="8" fill="#fff" stroke="#5c7a3f" stroke-width="1.3"/>
<text x="560" y="186" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#5c7a3f" text-anchor="middle">1. NORMALISER</text>
<text x="560" y="200" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="10" fill="#7a6a58" text-anchor="middle">minuscules · accents · ponctuation</text>
<rect x="390" y="265" width="340" height="48" rx="8" fill="#fff" stroke="#5c7a3f" stroke-width="1.3"/>
<text x="560" y="286" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#5c7a3f" text-anchor="middle">2. ÉTENDRE aux synonymes</text>
<text x="560" y="300" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="10" fill="#7a6a58" text-anchor="middle">karité = shea = sii · bissap = da = oseille</text>
<rect x="390" y="365" width="340" height="34" rx="8" fill="#fff" stroke="#2f5d8a" stroke-width="1.3"/>
<text x="560" y="386" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#2f5d8a" text-anchor="middle">Résultats ?</text>
<rect x="390" y="465" width="340" height="48" rx="8" fill="#fff" stroke="#8a5a1c" stroke-width="1.3"/>
<text x="560" y="486" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#8a5a1c" text-anchor="middle">3. TOLÉRER les fautes</text>
<text x="560" y="500" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="10" fill="#7a6a58" text-anchor="middle">distance d'édition, EN DERNIER RECOURS</text>
<rect x="390" y="565" width="340" height="34" rx="8" fill="#fff" stroke="#2f5d8a" stroke-width="1.3"/>
<text x="560" y="586" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#2f5d8a" text-anchor="middle">Résultats ?</text>
<rect x="390" y="665" width="340" height="48" rx="8" fill="#fff" stroke="#b3261e" stroke-width="1.3"/>
<text x="560" y="686" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#b3261e" text-anchor="middle">4. RETENIR le terme</text>
<text x="560" y="700" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="10" fill="#7a6a58" text-anchor="middle">recherches_infructueuses</text>
