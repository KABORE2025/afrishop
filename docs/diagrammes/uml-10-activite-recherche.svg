<polyline points="560,199 560,265" fill="none" stroke="#8a7f72" stroke-width="1.2" marker-end="url(#fl)"/>
<polyline points="560,299 560,365" fill="none" stroke="#8a7f72" stroke-width="1.2" marker-end="url(#fl)"/>
<polyline points="560,399 560,465" fill="none" stroke="#8a7f72" stroke-width="1.2" marker-end="url(#fl)"/>
